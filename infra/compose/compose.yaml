# Local development and single-VM deployment (see scripts/deploy.sh).
# Pass --env-file .env so ${...} below comes from the repo-root .env, not infra/compose/.env:
#   Infra only:   docker compose --env-file .env -f infra/compose/compose.yaml up -d postgres typesense
#   Full stack:   docker compose --env-file .env -f infra/compose/compose.yaml --profile app up -d --build
name: domino-news

x-app: &app
  image: domino-news-app:local
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile
  env_file: ../../.env
  environment:
    DATABASE_URL: postgres://dn:dn@postgres:5432/dn
    TYPESENSE_URL: http://typesense:8108
  # Private CA for the inference endpoint, if any: drop the PEM into infra/compose/certs/
  # and set INFERENCE_CA_CERT=/certs/inference-ca.pem in .env.
  volumes:
    - ./certs:/certs:ro
  depends_on:
    postgres:
      condition: service_healthy
    typesense:
      condition: service_started
  restart: unless-stopped
  profiles: [app]

services:
  postgres:
    image: pgvector/pgvector:pg17-trixie
    environment:
      POSTGRES_USER: dn
      POSTGRES_PASSWORD: dn
      POSTGRES_DB: dn
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dn -d dn"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  typesense:
    image: typesense/typesense:30.2
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-dev-typesense-key}", "--enable-cors=false"]
    ports:
      - "127.0.0.1:${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - tsdata:/data
    restart: unless-stopped

  # Commands call tsx directly: Compose already injects .env, and the pnpm scripts'
  # --env-file-if-exists would only log that the file is missing in the image.
  migrate:
    <<: *app
    working_dir: /app/packages/db
    command: ["node_modules/.bin/tsx", "src/migrate.ts"]
    restart: "no"

  web:
    <<: *app
    command: ["node", "apps/web/server.mjs"]
    environment:
      DATABASE_URL: postgres://dn:dn@postgres:5432/dn
      TYPESENSE_URL: http://typesense:8108
      PORT: "4000"
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    working_dir: /app/apps/worker
    command: ["node_modules/.bin/tsx", "src/worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  indexer:
    <<: *app
    working_dir: /app/apps/worker
    command: ["node_modules/.bin/tsx", "src/indexer.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  tsdata:
