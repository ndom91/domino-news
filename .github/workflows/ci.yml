name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_USER: dn
          POSTGRES_PASSWORD: dn
          POSTGRES_DB: dn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dn" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://dn:dn@localhost:5432/dn_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          # v5 auto-caches via the packageManager field, which needs pnpm before corepack enables it.
          package-manager-cache: false
      # Node 25+ no longer bundles corepack.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    env:
      # Fixture pubDates are fixed; treat them all as fresh so CI doesn't depend on today's date.
      FRESH_WINDOW_HOURS: "100000"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          # v5 auto-caches via the packageManager field, which needs pnpm before corepack enables it.
          package-manager-cache: false
      # Node 25+ no longer bundles corepack.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: docker compose -f infra/compose/compose.yaml up -d --wait postgres typesense
      - run: pnpm db:migrate
      - run: pnpm cli seed
      - run: pnpm cli user:create --username dev --password dev-password-change-me
      # Fixture mode: deterministic, no GPU. Worker + indexer run the pipeline in the background.
      - run: |
          (cd apps/worker && pnpm start > ../../worker.log 2>&1 &)
          (cd apps/worker && pnpm start:indexer > ../../indexer.log 2>&1 &)
          pnpm cli ingest
          for i in $(seq 1 60); do
            published=$(pnpm --silent cli status | jq '.pipeline.storiesPublished' || echo 0)
            [ "${published:-0}" -gt 5 ] && exit 0
            sleep 5
          done
          echo "pipeline did not publish stories in time" && exit 1
      - run: |
          pnpm build
          (cd apps/web && pnpm start > ../../web.log 2>&1 &)
          curl --retry 30 --retry-connrefused --retry-delay 1 -sf -o /dev/null http://localhost:4000/login
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        run: tail -n 100 worker.log indexer.log web.log
